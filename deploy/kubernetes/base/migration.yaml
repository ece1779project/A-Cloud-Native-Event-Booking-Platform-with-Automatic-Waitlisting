apiVersion: batch/v1
kind: Job
metadata:
  name: seatflow-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: seatflow-app:latest
          imagePullPolicy: IfNotPresent
          command: [/app/.venv/bin/alembic, upgrade, head]
          envFrom:
            - configMapRef:
                name: seatflow-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: seatflow-secrets
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
