apiVersion: v1
kind: ConfigMap
metadata:
  name: seatflow-config
data:
  ENVIRONMENT: minikube
  LOG_LEVEL: INFO
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  REDIS_URL: redis://redis:6379/0
  HOLD_VALIDITY_SECONDS: "300"
  OFFER_VALIDITY_SECONDS: "600"
  REGISTRATION_WRITE_LIMIT_PER_MINUTE: "30"
  LOGIN_LIMIT_PER_MINUTE: "10"
  TRUSTED_PROXY_CIDRS: ""
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  JWT_ISSUER: seatflow
  JWT_AUDIENCE: seatflow-api
  ACCESS_TOKEN_TTL_SECONDS: "900"
  REFRESH_TOKEN_TTL_SECONDS: "604800"
  WORKER_SCAN_INTERVAL_SECONDS: "1"
  WORKER_SCAN_BATCH_SIZE: "100"
  WORKER_METRICS_PORT: "9100"
