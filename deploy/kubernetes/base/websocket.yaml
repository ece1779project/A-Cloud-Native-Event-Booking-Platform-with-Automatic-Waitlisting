apiVersion: v1
kind: Service
metadata:
  name: websocket
spec:
  selector:
    app.kubernetes.io/name: websocket
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: websocket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: websocket
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: websocket
          image: ticketbooking-app:latest
          imagePullPolicy: IfNotPresent
          command:
            - /app/.venv/bin/uvicorn
            - app.realtime.gateway.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --ws-ping-interval
            - "25"
            - --ws-ping-timeout
            - "10"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ticketbooking-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ticketbooking-secrets
                  key: database-url
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
