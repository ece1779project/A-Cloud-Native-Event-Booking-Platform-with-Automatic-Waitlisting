apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ticketbooking-app:latest
          imagePullPolicy: IfNotPresent
          command: [/app/.venv/bin/python, -m, app.workers]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: ticketbooking-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ticketbooking-secrets
                  key: database-url
          startupProbe:
            httpGet:
              path: /health/ready
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
