  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#208578"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #19324D; }
    .muted { fill: #52677B; }
    .line { fill: none; stroke: #376C9D; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .event { fill: none; stroke: #208578; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 6; }
  </style>
</defs>
